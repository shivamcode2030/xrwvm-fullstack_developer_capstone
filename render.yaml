services:
  - type: web
    name: shivam-car-dealership
    runtime: python
    plan: free
    rootDir: server
    buildCommand: ./build.sh
    startCommand: gunicorn djangoproj.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12

      - key: DEBUG
        value: "False"

      - key: SECRET_KEY
        generateValue: true
