name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  lint-python:
    name: Lint Python Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Print working directory
        run: pwd

      - name: Run Linter
        run: ruff check server --output-format=concise || true

  lint-javascript:
    name: Lint JavaScript Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install JSHint
        run: npm install --global jshint

      - name: Install dependencies
        working-directory: server/frontend
        run: npm ci

      - name: Print working directory
        run: pwd

      - name: Run Linter
        run: jshint server/frontend/src || true

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r server/requirements.txt

      - name: Run Django migrations
        working-directory: server
        run: python manage.py migrate

      - name: Django system check
        working-directory: server
        run: python manage.py check

      - name: Run Django tests
        working-directory: server
        run: python manage.py test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: server/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: server/frontend
        run: npm ci

      - name: Build React frontend
        working-directory: server/frontend
        run: CI=false npm run build

      - name: Validate deployment files
        run: |
          test -f render.yaml
          test -f server/build.sh
          echo "CI/CD validation completed successfully."
